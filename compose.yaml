name: lldap

x-daemonless:
  title: "lldap"
  icon: ":material-apps:"  # https://pictogrammers.com/library/mdi/ (material-) or https://simpleicons.org/ (simple-)
  category: "Infrastructure"
  description: "This project is a lightweight authentication server that provides an opinionated, simplified LDAP interface for authentication."
  upstream_url: "https://github.com/lldap/lldap"
  web_url: "https://github.com/lldap/lldap"
  freshports_url: "https://www.freshports.org/net/lldap/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"
  notes: |
    ## First start
    The first start writes `/config/lldap_config.toml` with its own random
    JWT secret, key seed and admin password, and logs the admin login once:
    `[lldap] Admin login: admin / <password>`. Change the password in the web UI.

    To choose them yourself instead, set any of these before the first start
    (the JWT secret and the password can also be read from a file:
    `LLDAP_JWT_SECRET_FILE`, `LLDAP_LDAP_USER_PASS_FILE`):
    ```yaml
    services:
      lldap:
        environment:
          - LLDAP_LDAP_USER_EMAIL=admin@example.com
          - LLDAP_LDAP_USER_PASS=very_secure_password
          - LLDAP_JWT_SECRET=<random>
          - LLDAP_KEY_SEED=<random>
    ```

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
    volumes:
      /config: "Configuration directory"
    ports:
      17170: "Web UI"
      3890:  "LDAP"

services:
  lldap:
    image: ghcr.io/daemonless/lldap:latest
    container_name: lldap
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    volumes:
      - /path/to/containers/lldap:/config

    ports:
      - 17170:17170
      - 3890:3890

